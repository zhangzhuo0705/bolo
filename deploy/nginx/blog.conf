# 站点通用配置：由 http/https 模板 include
root  /usr/share/nginx/html;
index index.html;
charset utf-8;

# HTML 不缓存，静态资源单独设置
expires -1;

gzip              on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_vary         on;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    application/rss+xml
    image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# 容器健康检查入口（HTTP/HTTPS 均可用）
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location / {
    try_files $uri $uri/ =404;
}

# 静态资源缓存 7 天
location ~* \.(?:css|js|mjs|map|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
}

location = /404.html {
    internal;
}

error_page 404 /404.html;
